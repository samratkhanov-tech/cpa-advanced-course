<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>🎬 ভিডিও ক্লাস — CPA Advanced Master Course</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
  :root{ --bg:#0a0f24; --card:#131a3a; --card2:#0e1430; --line:#2a3a75; --text:#eef1ff; --muted:#a8b3d8; --gold:#f5b301; --gold2:#ff8a00; --green:#25d366; }
  *{box-sizing:border-box}
  body{font-family:'Hind Siliguri','Segoe UI',system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#16204d 0%,var(--bg) 60%);color:var(--text);margin:0;min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:32px 18px 60px}
  .topnav{margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
  .topnav a{color:var(--muted);text-decoration:none;font-size:14px}
  .langtoggle{display:flex;gap:6px}
  .langtoggle button{background:var(--card2);border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit}
  .langtoggle button.active{background:var(--gold);color:#141414;border-color:var(--gold);font-weight:700}
  .hero{text-align:center;margin-bottom:20px}
  .hero h1{font-size:28px;margin:8px 0;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted)}
  .codebox{background:var(--card);border:1px solid var(--gold);border-radius:18px;padding:26px;max-width:520px;margin:0 auto 28px;text-align:center}
  .codebox h3{margin:0 0 6px}
  .codebox p{color:var(--muted);font-size:14px;margin:6px 0 14px}
  .codebox input{width:100%;padding:14px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:18px;margin:6px 0 12px;font-family:inherit;text-align:center;letter-spacing:3px;text-transform:uppercase;font-weight:700}
  .btn{display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#141414;font-weight:800;font-size:15px;padding:13px 30px;border-radius:12px;border:none;cursor:pointer;font-family:inherit}
  .btn-green{background:linear-gradient(135deg,#25d366,#128c4b);color:#fff}
  .cmsg{margin-top:12px;font-size:14px;font-weight:600;min-height:20px}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .vcard.playable{cursor:pointer;transition:transform .2s}
  .vcard.playable:hover{transform:translateY(-3px)}
  .vthumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
  .vthumb img{width:100%;height:100%;object-fit:cover}
  .vthumb .noimg{display:flex;align-items:center;justify-content:center;height:100%;font-size:48px;background:linear-gradient(135deg,#1a2350,#0e1430)}
  .vlock{position:absolute;inset:0;background:rgba(5,8,25,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;backdrop-filter:blur(2px)}
  .vlock .lockicon{font-size:44px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
  .vlock span{font-size:13px;color:var(--gold);font-weight:700}
  .vbody{padding:14px 16px}
  .vbody b{display:block;margin-bottom:4px}
  .vbody .vnum{font-size:12px;color:var(--muted)}
  .vplayer{display:none;padding:0}
  .vplayer iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
  .loading{text-align:center;padding:40px;color:var(--muted)}
  .whoami{text-align:center;margin-bottom:18px;display:none}
  .whoami b{color:var(--green)}
  .whoami a{color:var(--muted);font-size:13px;margin-left:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a href="./" id="backLink">← মূল পেজে ফিরে যাও</a>
    <div class="langtoggle">
      <button id="langBn" class="active" onclick="setLang('bn')">বাংলা</button>
      <button id="langEn" onclick="setLang('en')">English</button>
    </div>
  </div>
  <div class="hero">
    <div style="font-size:46px">🎬</div>
    <h1 id="pageTitle">ভিডিও ক্লাস</h1>
    <p id="pageSub">২৮টি ক্লাস — তোমার এক্সেস কোড দিয়ে আনলক করো</p>
  </div>

  <div class="codebox" id="codeBox">
    <h3 id="cbTitle">🔑 তোমার এক্সেস কোড দাও</h3>
    <p id="cbText">পেমেন্টের পর মেন্টর তোমাকে যে কোড পাঠিয়েছে, সেটা এখানে লেখো। কোডটা শুধু তোমার ডিভাইসেই চলবে।</p>
    <input type="text" id="codeInput" placeholder="XXXXXXXX" maxlength="12" autocomplete="off">
    <div><button class="btn" id="codeGo">🔓 ভিডিও আনলক করো</button></div>
    <div class="cmsg" id="codeMsg"></div>
  </div>

  <div class="whoami" id="whoami">
    <span id="whoText"></span><a href="#" id="logoutLink"></a>
  </div>

  <div class="vgrid" id="vgrid">
    <div class="loading" id="vloading">⏳ লোড হচ্ছে...</div>
  </div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbwJMKOJN_TW6hT8pGudK_2tCfrO53mJ3kL71FGS1SR9NTk1bac8qOi-rcaSMdfWbDE__w/exec';
var LANG = 'bn';
var VIDEOS = [];
var EMBEDS = {};
var UNLOCKED = false;
var T = {
  bn: {
    back: '← মূল পেজে ফিরে যাও',
    pageTitle: 'ভিডিও ক্লাস',
    pageSub: '২৮টি ক্লাস — তোমার এক্সেস কোড দিয়ে আনলক করো',
    cbTitle: '🔑 তোমার এক্সেস কোড দাও',
    cbText: 'পেমেন্টের পর মেন্টর তোমাকে যে কোড পাঠিয়েছে, সেটা এখানে লেখো। কোডটা শুধু তোমার ডিভাইসেই চলবে।',
    cbGo: '🔓 ভিডিও আনলক করো',
    loading: '⏳ লোড হচ্ছে...',
    noVideo: 'শীঘ্রই আসছে',
    locked: '🔒 তালা — কোড দিয়ে আনলক করো',
    tapToPlay: '▶️ দেখো',
    classLabel: 'ক্লাস',
    checking: '⏳ যাচাই হচ্ছে...',
    invalid: '❌ ভুল কোড! মেন্টরের পাঠানো কোডটা ঠিকমতো লেখো।',
    mismatch: '❌ এই কোড অন্য ডিভাইসে ব্যবহার হয়েছে। নতুন কোডের জন্য WhatsApp-এ মেসেজ করো: 8801842793958',
    revoked: '❌ এই কোড বাতিল করা হয়েছে।',
    err: '❌ সার্ভারে সমস্যা, একটু পরে চেষ্টা করো।',
    welcome: 'স্বাগতম',
    logout: 'লগআউট',
    unlockedMsg: '✅ আনলক হয়েছে! নিচের ভিডিওগুলোতে চাপ দিয়ে দেখো।'
  },
  en: {
    back: '← Back to main page',
    pageTitle: 'Video Classes',
    pageSub: '28 classes — unlock with your access code',
    cbTitle: '🔑 Enter your access code',
    cbText: 'Enter the code your mentor sent you after payment. The code works only on your device.',
    cbGo: '🔓 Unlock videos',
    loading: '⏳ Loading...',
    noVideo: 'Coming soon',
    locked: '🔒 Locked — unlock with code',
    tapToPlay: '▶️ Watch',
    classLabel: 'Class',
    checking: '⏳ Verifying...',
    invalid: '❌ Wrong code! Enter the code your mentor sent you.',
    mismatch: '❌ This code was used on another device. Message on WhatsApp for a new code: 8801842793958',
    revoked: '❌ This code has been revoked.',
    err: '❌ Server error, try again later.',
    welcome: 'Welcome',
    logout: 'Logout',
    unlockedMsg: '✅ Unlocked! Tap the videos below to watch.'
  }
};
function getDevice(){
  try{
    var d = localStorage.getItem('cpaVidDev');
    if(!d){ d = 'd' + Math.random().toString(36).slice(2,14) + Date.now().toString(36); localStorage.setItem('cpaVidDev', d); }
    return d;
  }catch(e){ return 'nodev'; }
}
function setLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('langBn').className = l==='bn' ? 'active' : '';
  document.getElementById('langEn').className = l==='en' ? 'active' : '';
  var t = T[l];
  document.getElementById('backLink').textContent = t.back;
  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('pageSub').textContent = t.pageSub;
  document.getElementById('cbTitle').textContent = t.cbTitle;
  document.getElementById('cbText').textContent = t.cbText;
  document.getElementById('codeGo').textContent = t.cbGo;
  document.getElementById('logoutLink').textContent = t.logout;
  render();
  try{ localStorage.setItem('cpaVidLang', l); }catch(e){}
}
function escapeH(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function render(){
  var t = T[LANG];
  var g = document.getElementById('vgrid');
  if(!VIDEOS.length){ g.innerHTML = '<div class="loading">'+t.loading+'</div>'; return; }
  var h = '';
  VIDEOS.forEach(function(v){
    var hasEmbed = !!EMBEDS[v.num];
    h += '<div class="vcard'+(hasEmbed?' playable':'')+'" data-num="'+v.num+'">';
    h += '<div class="vthumb">';
    if(v.thumb){ h += '<img src="'+v.thumb+'" alt="" loading="lazy">'; }
    else { h += '<div class="noimg">🎬</div>'; }
    if(v.has_video && !hasEmbed){
      h += '<div class="vlock"><div class="lockicon">🔒</div><span>'+t.locked+'</span></div>';
    } else if(!v.has_video){
      h += '<div class="vlock"><div class="lockicon">⏳</div><span>'+t.noVideo+'</span></div>';
    } else {
      h += '<div class="vlock" style="background:rgba(5,8,25,.45)"><div class="lockicon">▶️</div><span>'+t.tapToPlay+'</span></div>';
    }
    h += '</div>';
    h += '<div class="vplayer" id="vp'+v.num+'"></div>';
    h += '<div class="vbody"><span class="vnum">'+t.classLabel+' '+v.num+'</span><b>'+escapeH(v.title)+'</b></div>';
    h += '</div>';
  });
  g.innerHTML = h;
  g.querySelectorAll('.vcard.playable').forEach(function(c){
    c.addEventListener('click', function(){ playVid(+c.getAttribute('data-num')); });
  });
}
function playVid(num){
  var em = EMBEDS[num];
  if(!em) return;
  var vp = document.getElementById('vp'+num);
  if(vp.style.display === 'block'){ vp.style.display='none'; vp.innerHTML=''; return; }
  vp.style.display = 'block';
  vp.innerHTML = '<iframe src="'+em+'" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>';
  vp.scrollIntoView({behavior:'smooth', block:'center'});
}
function doAccess(code, silent){
  var t = T[LANG];
  var msg = document.getElementById('codeMsg');
  if(!silent){ msg.textContent = t.checking; msg.style.color = '#a8b3d8'; }
  var fd = new FormData();
  fd.append('type', 'videocode_verify');
  fd.append('code', code);
  fd.append('device', getDevice());
  fetch(API, {method:'POST', body: fd}).then(function(r){ return r.json(); }).then(function(j){
    if(j && j.ok){
      UNLOCKED = true;
      EMBEDS = {};
      (j.videos||[]).forEach(function(v){ EMBEDS[v.num] = v.embed; });
      try{ localStorage.setItem('cpaVidCode', code); }catch(e){}
      document.getElementById('codeBox').style.display = 'none';
      var w = document.getElementById('whoami');
      w.style.display = 'block';
      document.getElementById('whoText').innerHTML = '👋 <b>'+escapeH(j.name||'')+'</b> — ' + t.unlockedMsg;
      render();
    } else {
      try{ localStorage.removeItem('cpaVidCode'); }catch(e){}
      // পুরনো কোড বাতিল হলে কোড বক্স আবার দেখাও
      document.getElementById('codeBox').style.display = 'block';
      document.getElementById('whoami').style.display = 'none';
      UNLOCKED = false; EMBEDS = {};
      var e2 = (j && j.error) || 'err';
      msg.textContent = t[e2] || t.err;
      msg.style.color = '#ff7b7b';
      render();
    }
  }).catch(function(){
    msg.textContent = t.err; msg.style.color = '#ff7b7b';
  });
}
document.getElementById('codeGo').addEventListener('click', function(){
  var c = document.getElementById('codeInput').value.trim().toUpperCase();
  if(c) doAccess(c, false);
});
document.getElementById('codeInput').addEventListener('keypress', function(e){
  if(e.key==='Enter'){ var c = this.value.trim().toUpperCase(); if(c) doAccess(c, false); }
});
document.getElementById('logoutLink').addEventListener('click', function(e){
  e.preventDefault();
  try{ localStorage.removeItem('cpaVidCode'); }catch(e2){}
  location.reload();
});

// init
try{ var sl = localStorage.getItem('cpaVidLang'); if(sl==='en') LANG='en'; }catch(e){}
fetch(API+'?get=videos').then(function(r){ return r.json(); }).then(function(j){
  if(j && j.ok){ VIDEOS = j.videos; }
  render();
  setLang(LANG);
  // auto-login with saved code
  try{
    var sc = localStorage.getItem('cpaVidCode');
    if(sc) doAccess(sc, true);
  }catch(e){}
}).catch(function(){ render(); setLang(LANG); });
setLang(LANG);
</script>
</body>
</html>
